name: CI

on:
  push:
    branches: [ master, development ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch: {}

jobs:
  test:
    name: "PHPUnit: MW ${{ matrix.mw }}, PHP ${{ matrix.php }}"
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      matrix:
        include:
          - mw: 'REL1_43'
            php: 8.2
            experimental: false
            coverage: true
          - mw: 'REL1_44'
            php: 8.2
            experimental: false
            coverage: false
          - mw: 'REL1_44'
            php: 8.3
            experimental: false
            coverage: false
          - mw: 'REL1_45'
            php: 8.2
            experimental: false
            coverage: false
          - mw: 'REL1_45'
            php: 8.3
            experimental: false
            coverage: false
          - mw: 'REL1_46'
            php: 8.3
            experimental: false
            coverage: false
          - mw: 'REL1_46'
            php: 8.5
            experimental: false
            coverage: false
          - mw: 'master'
            php: 8.3
            experimental: true
            coverage: false
          - mw: 'master'
            php: 8.5
            experimental: true
            coverage: false

    runs-on: ubuntu-latest

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl
          tools: composer

      - name: Cache MediaWiki
        id: cache-mediawiki
        uses: actions/cache@v6
        with:
          path: |
            mediawiki
            !mediawiki/extensions/
            !mediawiki/vendor/
          key: mw_${{ matrix.mw }}-php${{ matrix.php }}-v1

      - name: Cache Composer cache
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-php${{ matrix.php }}

      - uses: actions/checkout@v7
        with:
          path: EarlyCopy

      - name: Install MediaWiki
        if: steps.cache-mediawiki.outputs.cache-hit != 'true'
        run: bash EarlyCopy/.github/workflows/installWiki.sh ${{ matrix.mw }}

      - uses: actions/checkout@v7
        with:
          path: mediawiki/extensions/RobloxAPI

      - name: Composer update (core)
        run: composer update
        working-directory: mediawiki

      - name: Run PHPUnit without coverage
        run: composer run phpunit extensions/RobloxAPI/tests
        if: matrix.coverage == false
        working-directory: mediawiki

      #- name: Run PHPUnit and generate coverage report
      #  run: XDEBUG_MODE=coverage vendor/bin/phpunit --configuration extensions/RobloxAPI/phpunit.xml --coverage-clover coverage.xml
      #  if: matrix.coverage == true

      #- name: Upload coverage to Codecov
#        uses: codecov/codecov-action@v5
#        if: matrix.coverage == true
#        with:
#          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Run parser tests
        run: php tests/parser/parserTests.php --file=extensions/RobloxAPI/tests/parser/parserTests.txt
        working-directory: mediawiki

      - name: Composer update (extension)
        run: composer update
        working-directory: mediawiki/extensions/RobloxAPI

      - name: Run phan
        working-directory: mediawiki/extensions/RobloxAPI
        run: composer run phan
  # We only want to run this during full CI for now; in the future, this will be moved to lint-check.yml
  banana-lint:
    name: "Lint message files"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
        name: Install dependencies
      - run: npm test
        name: Run banana
